<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>粵語口語練習</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c2410c">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="粵語練習">
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#1f1d1a;--muted:#6b665e;--line:#e7e1d6;--accent:#c2410c;--accent-soft:#fde8dc;--ok:#15803d;--bad:#b91c1c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171513;--card:#211e1b;--ink:#f1ece4;--muted:#a59e93;--line:#38332d;--accent:#fb923c;--accent-soft:#3a2416;--ok:#4ade80;--bad:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:12px;padding:12px 0}
.top h1{font-size:18px;margin:0;flex:1}
nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px}
nav button{border:0;background:none;color:var(--muted);padding:8px 12px;border-radius:999px;font:inherit;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
main{padding:20px 0 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.lesson-card{cursor:pointer}.lesson-card:hover{border-color:var(--accent)}
.muted{color:var(--muted);font-size:14px}
.hz{font-size:22px;font-weight:600}
.jp{color:var(--accent);font-family:ui-monospace,Consolas,monospace;font-size:14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.item{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .txt{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.icon{width:36px;height:36px;padding:0;display:inline-grid;place-items:center;flex:none;border-radius:50%}
h2{font-size:20px;margin:0 0 4px}h3{font-size:16px;margin:16px 0 8px}
.tip{background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin:6px 0;font-size:15px}
.banner{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.choices{display:grid;gap:8px;margin-top:12px}
.choices .btn{text-align:left;padding:12px}
.choices .ok{border-color:var(--ok);color:var(--ok)}.choices .bad{border-color:var(--bad);color:var(--bad)}
.score{font-size:28px;font-weight:700}
.flash{text-align:center;padding:36px 16px}
.flash .hz{font-size:40px}
.tone-bar{height:44px;position:relative;margin:6px 0}
select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
label.sw{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.line{cursor:pointer;border-radius:10px;transition:background .15s}
.line.playing{background:var(--accent-soft)}
.lk{font-size:24px;line-height:1.3;display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 2px}
.lk a.rb{display:inline-flex;flex-direction:column;align-items:center;min-width:2.4em;color:inherit;text-decoration:none;border-radius:6px;padding:2px 1px}
.lk a.rb small{font-size:11px;color:var(--accent);font-family:ui-monospace,Consolas,monospace}
.lk a.rb:hover{background:var(--accent-soft)}
.line.turn{background:color-mix(in srgb, var(--ok) 15%, transparent)}
.your-turn{display:none;margin-left:8px;color:var(--ok);font-weight:600}
.line.turn .your-turn{display:inline}
.hide-jp .line .jp,.hide-zh .line .zh{visibility:hidden}
.toggles{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.toggles .btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-right:6px}
details.card summary{cursor:pointer;list-style:none}
details.card summary::-webkit-details-marker{display:none}
details.card[open] summary{margin-bottom:8px}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top"><h1>粵語口語練習 🗣️</h1>
    <label class="sw">語速 <select id="rate"><option value="0.6">慢</option><option value="0.75">稍慢</option><option value="0.85">中</option><option value="1">正常</option><option value="1.15">母語速度</option></select></label>
  </div>
  <nav id="nav">
    <button data-v="home" class="on">課程</button>
    <button data-v="patterns">句型</button>
    <button data-v="stories">對話劇場</button>
    <button data-v="reactions">口語反應</button>
    <button data-v="lookup">查字幕</button>
    <button data-v="tones">聲調</button>
    <button data-v="listen">聽力測驗</button>
    <button data-v="speak">跟讀</button>
    <button data-v="flash">字卡複習</button>
  </nav>
</div></header>
<main class="wrap" id="app"></main>

<script src="lessons.js"></script>
<script src="patterns.js"></script>
<script src="stories.js"></script>
<script src="content-muse.js"></script>
<script src="audio-map.js"></script>
<script>
const $ = s => document.querySelector(s);
const app = $('#app');
const L = window.LESSONS || [];
// 不同課重複出現的詞只保留一次
const allVocab = (() => { const seen = new Set(); return L.flatMap(l => l.vocab.map(v => ({...v, lesson: l.title}))).filter(v => !seen.has(v.hanzi) && seen.add(v.hanzi)); })();
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- 發音 ----------
// 有預先錄製的神經網路語音檔就播音檔（語速一定有效）；沒有的句子（例如查字幕）才用裝置內建語音
const AUDIO_MAP = window.AUDIO_MAP || {};
let yueVoice = null, curAudio = null, playToken = 0;
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  yueVoice = vs.find(v => /zh[-_]HK|yue/i.test(v.lang)) || vs.find(v => /Cantonese|粵|廣東|Hong Kong/i.test(v.name)) || null;
}
if ('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
const getRate = () => parseFloat(store.get('rate', '0.85'));
function stopAll(){
  playToken++;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  if (curAudio){ curAudio.pause(); curAudio = null; }
}
function ttsSpeak(text, rate, done){
  if (!('speechSynthesis' in window)) return done();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-HK'; if (yueVoice) u.voice = yueVoice;
  u.rate = rate; u.onend = u.onerror = done;
  speechSynthesis.speak(u);
}
// 播放一句，回傳 Promise（播完才 resolve），可用來接續播放整段對話
function playText(text, rate){
  rate = rate || getRate();
  return new Promise(resolve => {
    const file = AUDIO_MAP[text];
    if (!file) return ttsSpeak(text, rate, resolve);
    const a = new Audio('audio/' + file);
    a.playbackRate = rate; a.preservesPitch = true; a.webkitPreservesPitch = true;
    a.onended = a.onerror = () => resolve();
    curAudio = a;
    a.play().catch(() => ttsSpeak(text, rate, resolve));
  });
}
function say(text, rate){ stopAll(); return playText(text, rate); }
const hasClip = t => !!AUDIO_MAP[t];
const playBtn = (t, extra='') => `<button class="btn icon" title="播放" data-say="${esc(t)}" ${extra}>🔊</button>`;
document.addEventListener('click', e => {
  const b = e.target.closest('[data-say]'); if (b) say(b.dataset.say, b.dataset.rate ? parseFloat(b.dataset.rate) * getRate() / 0.85 : undefined);
});
// 只有查字幕這種需要裝置語音的頁面才顯示提醒
function voiceBanner(needTTS){
  if (!needTTS && Object.keys(AUDIO_MAP).length) return '';
  if (!('speechSynthesis' in window)) return `<div class="banner">這個瀏覽器不支援語音播放，請改用 Chrome、Edge 或手機瀏覽器。</div>`;
  if (!yueVoice) return `<div class="banner">這裡的發音使用裝置內建語音，找不到粵語（zh-HK）語音時可能變成國語腔。建議用 Edge 或手機開啟。</div>`;
  return '';
}

// ---------- 畫面 ----------
let cur = 'home';
const views = {
  home(){
    return voiceBanner() + `<h2>課程</h2><p class="muted">香港口語粵語，從最常用的句子開始。點進課程可聽發音、看對話。</p>
    <div class="grid">${L.map((l,i)=>`<div class="card lesson-card" data-lesson="${i}">
      <div class="muted">第 ${i+1} 課</div><div class="hz">${esc(l.title)}</div>
      <div class="muted">${esc(l.goal)}</div><div class="muted">${l.vocab.length} 個詞句 · ${l.dialogue.length} 句對話</div></div>`).join('')}
      ${(window.OUTLINE||[]).map((o,i)=>`<div class="card" style="opacity:.55">
      <div class="muted">第 ${L.length+i+1} 課 · 製作中</div><div class="hz">${esc(o.title)}</div><div class="muted">${esc(o.goal)}</div></div>`).join('')}</div>`;
  },
  lesson(i){
    const l = L[i];
    return `<button class="btn" data-go="home">← 返回課程</button>
    <h2 style="margin-top:14px">${esc(l.title)}</h2><p class="muted">${esc(l.goal)}</p>
    <h3>詞句</h3><div class="card">${l.vocab.map(v=>`<div class="item">${playBtn(v.hanzi)}
      <div class="txt"><div class="row"><span class="hz">${esc(v.hanzi)}</span><span class="jp">${esc(v.jyutping)}</span></div>
      <div>${esc(v.mandarin)}</div>${v.note?`<div class="muted">💡 ${esc(v.note)}</div>`:''}</div>
      <button class="btn icon" title="慢速" data-say="${esc(v.hanzi)}" data-rate="0.55">🐢</button></div>`).join('')}</div>
    <h3>對話</h3>${seqControls()}
    <div class="card" id="seqLines">${l.dialogue.map((d,k)=>lineHTML(d,k)).join('')}</div>
    <p class="muted">點任何一句可以單獨播放。「跟讀模式」會在每句之後停下來讓你跟著說。</p>
    ${l.tips?.length?`<h3>文法小提示</h3>${l.tips.map(t=>`<div class="tip">${esc(t)}</div>`).join('')}`:''}`;
  },
  patterns(){
    const P = window.PATTERNS || [];
    const groups = [...new Set(P.map(p => p.group))];
    return voiceBanner() + `<h2>常用句型</h2><p class="muted">聽懂整句話的關鍵：句尾語氣詞和連接詞。點開每個句型看說明，例句都可以播放。</p>
    ${groups.map(g => `<h3>${esc(g)}</h3>${P.filter(p => p.group === g).map(p => `<details class="card">
      <summary><div class="row"><span class="hz" style="font-size:19px">${esc(p.title)}</span><span class="muted" style="flex:1">${esc(p.meaning)}</span><span class="muted">▾</span></div></summary>
      <div class="tip">${esc(p.explain)}</div>
      ${p.examples.map(e => `<div class="item">${playBtn(e.hanzi)}<div class="txt"><div style="font-size:18px">${esc(e.hanzi)}</div>
        <div class="jp">${esc(e.jyutping)}</div><div class="muted">${esc(e.mandarin)}</div></div>
        <button class="btn icon" title="慢速" data-say="${esc(e.hanzi)}" data-rate="0.55">🐢</button></div>`).join('')}
    </details>`).join('')}`).join('')}`;
  },
  stories(){
    const S = window.STORIES || [];
    return voiceBanner() + `<h2>對話劇場</h2><p class="muted">原創短劇，像看港劇、卡通一樣練聽力。建議先隱藏粵拼和翻譯只用聽的，聽不懂再打開。</p>
    <div class="grid">${S.map((s,i)=>`<div class="card lesson-card" data-story="${i}">
      <span class="tag">${esc(s.style)}</span><div class="hz" style="margin-top:6px">${esc(s.title)}</div>
      <div class="muted">${esc(s.scene)}</div><div class="muted">${s.lines.length} 句台詞</div></div>`).join('')}</div>`;
  },
  reactions(){
    const R = window.REACTIONS || [];
    return voiceBanner() + `<h2>口語反應</h2><p class="muted">聊天時最常用的短回應。先記住這些，就能自然地接話。</p>
    <div class="card">${R.map(r => `<div class="item">${playBtn(r.hanzi)}<div class="txt">
      <div class="row"><span class="hz" style="font-size:19px">${esc(r.hanzi)}</span><span class="jp">${esc(r.jyutping)}</span></div>
      <div>${esc(r.mandarin)}</div>${r.note ? `<div class="muted">💡 ${esc(r.note)}</div>` : ''}</div>
      <button class="btn icon" title="慢速" data-say="${esc(r.hanzi)}" data-rate="0.55">🐢</button></div>`).join('')}</div>`;
  },
  story(i){
    const s = STORIES[i];
    const pref = store.get('storyView', {jp: true, zh: true});
    return `<button class="btn" data-go="stories">← 返回對話劇場</button>
    <h2 style="margin-top:14px">${esc(s.title)}</h2><p class="muted"><span class="tag">${esc(s.style)}</span>${esc(s.scene)}</p>
    ${seqControls()}
    <div class="card" id="seqLines">${s.lines.map((l,k)=>lineHTML(l,k)).join('')}</div>
    <p class="muted">點任何一句可以單獨播放。「跟讀模式」會在每句之後停下來讓你跟著說，這是最接近母語者的練習方式。</p>
    ${s.notes?.length?`<h3>重點解說</h3>${s.notes.map(t=>`<div class="tip">${esc(t)}</div>`).join('')}`:''}`;
  },
  lookup(){
    return voiceBanner(true) + `<h2>查字幕</h2><p class="muted">看港劇、卡通、YouTube 時，把看不懂的粵語字幕貼進來，每個字都會標上粵拼；課程裡學過的詞會列出意思。</p>
    <div class="card"><textarea id="lkIn" rows="4" placeholder="例如：你今晚得唔得閒呀？我哋去食糖水啦。" style="width:100%;font:inherit;font-size:18px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);resize:vertical">${esc(store.get('lkText', ''))}</textarea>
    <div class="row" style="margin-top:10px"><button class="btn primary" id="lkGo">標註粵拼</button><button class="btn" id="lkPlay">🔊 朗讀</button><button class="btn" id="lkClear">清除</button></div></div>
    <div id="lkOut"></div>
    <p class="muted">粵拼由開源工具 <a href="https://github.com/CanCLID/to-jyutping" target="_blank" rel="noopener">to-jyutping</a>（CanCLID）自動標註，多音字偶爾會標錯；點任何字可到粵典查詢。朗讀使用裝置內建語音，品質不如課程裡的錄音。</p>`;
  },
  tones(){
    const T = window.TONES || [];
    const y = c => 40 - (parseInt(c,10) - 1) * 9; // 1~5 → 高度
    return voiceBanner() + `<h2>六個聲調</h2><p class="muted">粵語靠聲調分辨意思。同一個「si」，六個聲調就是六個不同的字。先聽熟這六個再往下學。</p>
    <div class="grid">${T.map(t=>{const [a,b]=t.contour.split('');return `<div class="card">
      <div class="row">${playBtn(t.hanzi)}<span class="hz">${t.hanzi}</span><span class="jp">${t.jyutping}</span></div>
      <svg class="tone-bar" viewBox="0 0 120 44" width="100%"><line x1="10" y1="4" x2="10" y2="40" stroke="currentColor" opacity=".2"/>
      <polyline points="20,${y(a)} 110,${y(b)}" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round"/></svg>
      <div><b>第 ${t.tone} 聲 · ${t.name}</b> <span class="muted">(${t.contour})</span></div><div class="muted">${t.desc}</div></div>`}).join('')}</div>
    <div class="row"><button class="btn primary" id="playTones">▶ 依序播放 1～6 聲</button></div>
    <h3 style="margin-top:28px">聲調對比聽辨</h3><p class="muted">國語母語者最容易混淆的組合。聽一個音，選出是哪一個；答完才顯示答案。</p>
    <div class="card" id="pair"></div>`;
  },
  listen(){
    return voiceBanner() + `<h2>聽力測驗</h2><p class="muted">聽發音，選出正確的意思。</p>
    <label class="sw" style="margin-bottom:10px">題目 <select id="qSrc"><option value="vocab">詞句</option><option value="sentence">整句（課程對話＋句型例句＋劇場）</option></select></label>
    <div class="card" id="quiz"></div>`;
  },
  speak(){
    const ok = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
    return voiceBanner() + `<h2>跟讀練習</h2><p class="muted">先聽，再按「開始說」用粵語唸出來，系統會比對你說的字。</p>
    ${ok?'':'<div class="banner">這個瀏覽器不支援語音辨識。請用電腦版 Chrome 開啟（需要連網、允許麥克風）。</div>'}
    <div class="card"><label class="sw">練習範圍 <select id="spSrc"><option value="vocab">詞句</option><option value="dialogue">整句</option></select></label>
    <div id="spBox" style="margin-top:12px"></div></div>`;
  },
  flash(){
    return `<h2>字卡複習</h2><p class="muted">看到粵語，想想意思和唸法，翻面後誠實評分。答錯的卡會更常出現。</p><div class="card" id="fc"></div>`;
  }
};

function render(arg){
  app.innerHTML = (cur === 'lesson' || cur === 'story') ? views[cur](arg) : views[cur]();
  const parent = {lesson: 'home', story: 'stories'}[cur] || cur;
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.v === parent));
  if (cur === 'listen'){ const q = $('#qSrc'); q.value = qSrc; q.onchange = () => { qSrc = q.value; newQuiz(); }; newQuiz(); }
  if (cur === 'story') initSeq(STORIES[arg].lines);
  if (cur === 'lesson') initSeq(L[arg].dialogue);
  if (cur === 'speak') initSpeak();
  if (cur === 'flash') nextCard();
  if (cur === 'lookup') initLookup();
  if (cur === 'tones'){ $('#playTones').onclick = () => playSeq(TONES.map(t => t.hanzi), 0.8); newPair(); }
  window.scrollTo(0,0);
}
function go(v, arg){ stopAll(); cur = v; render(arg); }
async function playSeq(list, rate){
  stopAll(); const token = playToken;
  for (const t of list){ if (token !== playToken) return; await playText(t, rate); await sleep(300); }
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
$('#nav').onclick = e => { const b = e.target.closest('button'); if (b) go(b.dataset.v); };
app.addEventListener('click', e => {
  const c = e.target.closest('[data-lesson]'); if (c) return go('lesson', +c.dataset.lesson);
  const st = e.target.closest('[data-story]'); if (st) return go('story', +st.dataset.story);
  const g = e.target.closest('[data-go]'); if (g) return go(g.dataset.go);
});

// ---------- 對話播放（課程對話、對話劇場共用）----------
function lineHTML(l, k){
  return `<div class="item line" data-line="${k}"><div class="txt"><div class="muted">${esc(l.speaker)}<span class="your-turn">🎙 換你說</span></div>
    <div style="font-size:19px">${esc(l.hanzi)}</div><div class="jp">${esc(l.jyutping)}</div><div class="muted zh">${esc(l.mandarin)}</div></div></div>`;
}
function seqControls(){
  const pref = store.get('storyView', {jp: true, zh: true});
  return `<div class="toggles"><button class="btn primary" id="seqPlay">▶ 播放全部</button><button class="btn" id="seqShadow">🗣 跟讀模式</button>
    <button class="btn" id="seqStop">■ 停止</button><span style="flex:1"></span>
    <button class="btn${pref.jp?' on':''}" data-toggle="jp">粵拼</button><button class="btn${pref.zh?' on':''}" data-toggle="zh">翻譯</button></div>`;
}
function initSeq(lines){
  const box = $('#seqLines'); if (!box) return;
  const pref = store.get('storyView', {jp: true, zh: true});
  box.classList.toggle('hide-jp', !pref.jp); box.classList.toggle('hide-zh', !pref.zh);
  const mark = (k, turn) => box.querySelectorAll('.line').forEach((el, j) => { el.classList.toggle('playing', j === k && !turn); el.classList.toggle('turn', j === k && !!turn); });
  const run = async shadow => {
    stopAll(); const token = playToken;
    for (let k = 0; k < lines.length; k++){
      if (token !== playToken) return;
      mark(k); box.children[k].scrollIntoView({block: 'nearest', behavior: 'smooth'});
      const t0 = performance.now(); await playText(lines[k].hanzi);
      if (token !== playToken) return;
      if (shadow){ mark(k, true); await sleep(Math.max(1200, (performance.now() - t0) * 1.3 + 500)); }
      else await sleep(350);
    }
    mark(-1);
  };
  box.onclick = async e => { const l = e.target.closest('[data-line]'); if (!l) return; const k = +l.dataset.line; mark(k); await say(lines[k].hanzi); mark(-1); };
  $('#seqPlay').onclick = () => run(false);
  $('#seqShadow').onclick = () => run(true);
  $('#seqStop').onclick = () => { stopAll(); mark(-1); };
  document.querySelectorAll('[data-toggle]').forEach(b => b.onclick = () => {
    const p = store.get('storyView', {jp: true, zh: true}); const key = b.dataset.toggle;
    p[key] = !p[key]; store.set('storyView', p);
    b.classList.toggle('on', p[key]); box.classList.toggle('hide-' + key, !p[key]);
  });
}

// ---------- 聽力測驗 ----------
const shuffle = a => a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
let qStats = {right:0,total:0}, qSrc = 'vocab';
const allSentences = () => [
  ...L.flatMap(l => l.dialogue),
  ...(window.PATTERNS || []).flatMap(p => p.examples),
  ...(window.STORIES || []).flatMap(s => s.lines),
  ...(window.REACTIONS || [])
].filter(x => x.hanzi && x.mandarin);
function newQuiz(){
  const pool = uniqBy(qSrc === 'sentence' ? allSentences() : allVocab, x => x.hanzi);
  const box = $('#quiz'); if (!box || pool.length < 4) return;
  const ans = pickSmart(pool, 'quiz-' + qSrc, missWeight);
  const opts = shuffle([ans, ...shuffle(uniqBy(pool.filter(v => v.mandarin !== ans.mandarin), v => v.mandarin)).slice(0,3)]);
  box.innerHTML = `<div class="row"><button class="btn primary" data-say="${esc(ans.hanzi)}">🔊 播放</button>
    <button class="btn" data-say="${esc(ans.hanzi)}" data-rate="0.55">🐢 慢速</button>
    <span class="muted" style="margin-left:auto">答對 ${qStats.right} / ${qStats.total}</span></div>
    <div class="choices">${opts.map(o=>`<button class="btn" data-m="${esc(o.mandarin)}">${esc(o.mandarin)}</button>`).join('')}</div><div id="qRes"></div>`;
  setTimeout(() => say(ans.hanzi), 200);
  box.querySelector('.choices').onclick = e => {
    const b = e.target.closest('button'); if (!b || box.dataset.done) return;
    box.dataset.done = 1; qStats.total++;
    const right = b.dataset.m === ans.mandarin; if (right) qStats.right++;
    markResult(ans.hanzi, right);
    box.querySelectorAll('.choices button').forEach(x => { if (x.dataset.m === ans.mandarin) x.classList.add('ok'); else if (x===b) x.classList.add('bad'); });
    $('#qRes').innerHTML = `<div class="tip" style="margin-top:12px">${right?'✅ 答對！':'❌ 再接再厲'}　<b>${esc(ans.hanzi)}</b> <span class="jp">${esc(ans.jyutping)}</span></div>
      <button class="btn primary" id="qNext" style="margin-top:8px">下一題 →</button>`;
    $('#qNext').onclick = () => { delete box.dataset.done; newQuiz(); };
  };
}

// ---------- 查字幕 ----------
let tjReady = null;
const loadTJ = () => tjReady || (tjReady = new Promise((res, rej) => {
  if (window.ToJyutping) return res();
  const s = document.createElement('script'); s.src = 'vendor/to-jyutping.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s);
}));
// 用課程裡審過的詞覆蓋字典讀音（例如 糖水 tong4 seoi2），讓學過的詞一定標對
let tjConv = null;
function tjConverter(){
  if (tjConv) return tjConv;
  // 手動修正：字典把「食糖」整詞讀成 tong2，會蓋過「糖水」
  const map = {'糖水': 'tong4 seoi2', '食糖水': 'sik6 tong4 seoi2', '飲糖水': 'jam2 tong4 seoi2'};
  const all = [...allVocab, ...(window.REACTIONS || []), ...L.flatMap(l => l.dialogue), ...(window.STORIES || []).flatMap(s => s.lines), ...(window.PATTERNS || []).flatMap(p => p.examples)];
  for (const x of all){
    // 把句子切成「字」和「音節」，數量一致時逐段加入
    const chunks = x.hanzi.split(/[，。？！、,.?!\s「」…—]+/).filter(Boolean);
    const sylChunks = x.jyutping.split(/[,.?!]+/).map(s => s.trim()).filter(Boolean);
    if (chunks.length !== sylChunks.length) continue;
    chunks.forEach((c, i) => { const syl = sylChunks[i].split(/\s+/); if ([...c].length === syl.length && /^[一-鿿㐀-䶿\u{20000}-\u{2ffff}]+$/u.test(c) && c.length >= 2) map[c] = syl.join(' '); });
  }
  return (tjConv = window.ToJyutping.customize(map));
}
// 課程裡所有有意思的詞句，用來比對字幕
const glossary = () => uniqBy([...allVocab, ...(window.REACTIONS || [])], x => x.hanzi)
  .map(x => ({...x, key: x.hanzi.replace(/[？！，。、?!.,\s]/g, '')})).filter(x => x.key.length >= 2).sort((a, b) => b.key.length - a.key.length);
function initLookup(){
  const inp = $('#lkIn'), out = $('#lkOut');
  const run = async () => {
    const text = inp.value.trim(); store.set('lkText', text);
    if (!text){ out.innerHTML = ''; return; }
    out.innerHTML = '<div class="card muted">載入粵拼字典中…</div>';
    try { await loadTJ(); } catch { out.innerHTML = '<div class="card">粵拼字典載入失敗，請確認網路連線。</div>'; return; }
    const list = tjConverter().getJyutpingList(text);
    const ruby = list.map(([ch, jp]) => jp
      ? `<a class="rb" href="https://words.hk/zidin/${encodeURIComponent(ch)}" target="_blank" rel="noopener"><small>${esc(jp)}</small>${esc(ch)}</a>`
      : (ch === '\n' ? '<br>' : esc(ch))).join('');
    const flat = text.replace(/[？！，。、?!.,\s]/g, '');
    const found = []; let rest = flat;
    for (const g of glossary()) if (rest.includes(g.key)){ found.push(g); rest = rest.split(g.key).join('　'); }
    out.innerHTML = `<div class="card lk">${ruby}</div>
      ${found.length ? `<h3>課程裡學過的詞</h3><div class="card">${found.map(g => `<div class="item">${playBtn(g.hanzi)}<div class="txt">
        <div class="row"><span class="hz" style="font-size:18px">${esc(g.hanzi)}</span><span class="jp">${esc(g.jyutping)}</span></div><div>${esc(g.mandarin)}</div></div></div>`).join('')}</div>`
        : '<p class="muted">這段字幕裡沒有課程學過的詞。可以點字到粵典查意思。</p>'}`;
  };
  $('#lkGo').onclick = run;
  $('#lkPlay').onclick = async () => { const parts = inp.value.split(/(?<=[。！？!?\n])/).map(s => s.trim()).filter(Boolean); await playSeq(parts); };
  $('#lkClear').onclick = () => { inp.value = ''; store.set('lkText', ''); out.innerHTML = ''; inp.focus(); };
  if (inp.value.trim()) run();
}

// ---------- 出題：不重複、答錯的多出 ----------
const recentPicks = {};
function pickSmart(pool, key, weightOf){
  const recent = recentPicks[key] || (recentPicks[key] = []);
  const id = x => x.hanzi || x.label;
  let cands = pool.filter(x => !recent.includes(id(x)));
  if (!cands.length) cands = pool;
  const w = cands.map(x => Math.max(0.1, weightOf ? weightOf(x) : 1));
  let r = Math.random() * w.reduce((a, b) => a + b, 0), i = 0;
  while ((r -= w[i]) > 0 && i < cands.length - 1) i++;
  recent.push(id(cands[i])); if (recent.length > Math.min(20, Math.floor(pool.length * 0.6))) recent.shift();
  return cands[i];
}
const missed = () => store.get('missed', {});
function markResult(hanzi, right){
  const m = missed(); m[hanzi] = right ? Math.max(0, (m[hanzi] || 0) - 1) : (m[hanzi] || 0) + 2;
  if (!m[hanzi]) delete m[hanzi]; store.set('missed', m);
}
const missWeight = x => 1 + (missed()[x.hanzi] || 0);
const uniqBy = (arr, f) => { const s = new Set(); return arr.filter(x => !s.has(f(x)) && s.add(f(x))); };

// ---------- 聲調對比 ----------
let pStats = {right:0,total:0};
function newPair(){
  const box = $('#pair'); const P = window.TONE_PAIRS || []; if (!box || !P.length) return;
  const p = pickSmart(P, 'pair');
  const ans = Math.random() < .5 ? 'a' : 'b';
  box.innerHTML = `<div class="muted">${esc(p.label)}</div>
    <div class="row" style="margin-top:8px"><button class="btn primary" data-say="${esc(p[ans].hanzi)}">🔊 播放</button>
    <button class="btn" data-say="${esc(p[ans].hanzi)}" data-rate="0.55">🐢 慢速</button>
    <span class="muted" style="margin-left:auto">答對 ${pStats.right} / ${pStats.total}</span></div>
    <div class="choices" style="grid-template-columns:1fr 1fr">${['a','b'].map(k=>`<button class="btn" data-k="${k}" style="text-align:center"><span class="jp" style="font-size:18px">${esc(p[k].jyutping)}</span></button>`).join('')}</div><div id="pRes"></div>`;
  setTimeout(() => say(p[ans].hanzi), 200);
  box.querySelector('.choices').onclick = e => {
    const b = e.target.closest('button'); if (!b || box.dataset.done) return;
    box.dataset.done = 1; pStats.total++; const right = b.dataset.k === ans; if (right) pStats.right++;
    box.querySelectorAll('.choices button').forEach(x => {
      const k = x.dataset.k; x.innerHTML = `<span class="hz">${esc(p[k].hanzi)}</span> <span class="jp">${esc(p[k].jyutping)}</span>`;
      if (k === ans) x.classList.add('ok'); else if (x === b) x.classList.add('bad');
    });
    $('#pRes').innerHTML = `<div class="row" style="margin-top:10px"><span>${right?'✅ 答對！':'❌ 再聽一次比較看看'}</span>
      ${playBtn(p.a.hanzi)}<span class="muted">${esc(p.a.jyutping)}</span>${playBtn(p.b.hanzi)}<span class="muted">${esc(p.b.jyutping)}</span>
      <button class="btn primary" id="pNext" style="margin-left:auto">下一題 →</button></div>`;
    $('#pNext').onclick = () => { delete box.dataset.done; newPair(); };
  };
}

// ---------- 跟讀 ----------
const clean = s => s.replace(/[\s，。？！、,.?!「」]/g,'');
function similarity(a, b){
  a = clean(a); b = clean(b); if (!a.length) return 0;
  const dp = Array.from({length:a.length+1}, (_,i)=>[i, ...Array(b.length).fill(0)]);
  for (let j=1;j<=b.length;j++) dp[0][j]=j;
  for (let i=1;i<=a.length;i++) for (let j=1;j<=b.length;j++)
    dp[i][j] = Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1] + (a[i-1]===b[j-1]?0:1));
  return Math.max(0, 1 - dp[a.length][b.length] / Math.max(a.length, b.length));
}
let spItem = null;
function initSpeak(){ $('#spSrc').onchange = nextSpeak; nextSpeak(); }
function nextSpeak(){
  const src = $('#spSrc').value;
  const pool = src === 'vocab' ? allVocab : allSentences();
  spItem = pickSmart(uniqBy(pool, x => x.hanzi), 'speak-' + src, missWeight);
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  $('#spBox').innerHTML = `<div class="flash" style="padding:16px"><div class="hz">${esc(spItem.hanzi)}</div><div class="jp">${esc(spItem.jyutping)}</div><div class="muted">${esc(spItem.mandarin)}</div></div>
    <div class="row" style="justify-content:center">${playBtn(spItem.hanzi)}<button class="btn primary" id="rec" ${SR?'':'disabled'}>🎙️ 開始說</button><button class="btn" id="spNext">換一句 →</button></div>
    <div id="spRes" style="text-align:center;margin-top:12px"></div>`;
  $('#spNext').onclick = nextSpeak;
  if (!SR) return;
  $('#rec').onclick = () => {
    const r = new SR(); r.lang = 'zh-HK'; r.interimResults = false; r.maxAlternatives = 3;
    $('#rec').textContent = '🎙️ 聆聽中…'; $('#rec').disabled = true;
    r.onresult = e => {
      const alts = [...e.results[0]].map(x => x.transcript);
      const best = alts.reduce((m, t) => { const s = similarity(spItem.hanzi, t); return s > m.s ? {t, s} : m; }, {t: alts[0], s: -1});
      const pct = Math.round(best.s * 100);
      markResult(spItem.hanzi, pct >= 80);
      $('#spRes').innerHTML = `<div class="score" style="color:${pct>=80?'var(--ok)':pct>=50?'var(--accent)':'var(--bad)'}">${pct} 分</div>
        <div class="muted">辨識結果：「${esc(best.t)}」</div><div class="muted">${pct>=80?'很棒！':pct>=50?'接近了，注意聲調再試一次':'多聽幾次慢速發音再試'}</div>`;
    };
    r.onerror = e => { $('#spRes').innerHTML = `<div class="muted">沒有辨識到（${esc(e.error)}）。請確認已允許麥克風、網路正常。</div>`; };
    r.onend = () => { const b = $('#rec'); if (b){ b.textContent = '🎙️ 開始說'; b.disabled = false; } };
    r.start();
  };
}

// ---------- 字卡（Leitner 盒子） ----------
function nextCard(){
  const box = $('#fc'); if (!box) return;
  const lv = store.get('fcLevels', {});
  const c = pickSmart(allVocab, 'flash', v => 5 - (lv[v.hanzi] || 0));
  const known = allVocab.filter(v => (lv[v.hanzi]||0) >= 3).length;
  box.innerHTML = `<div class="muted">已熟練 ${known} / ${allVocab.length}</div>
    <div class="flash"><div class="hz">${esc(c.hanzi)}</div><div id="back" style="display:none;margin-top:10px">
    <div class="jp">${esc(c.jyutping)}</div><div>${esc(c.mandarin)}</div>${c.note?`<div class="muted">💡 ${esc(c.note)}</div>`:''}</div></div>
    <div class="row" style="justify-content:center" id="fcBtns"><button class="btn primary" id="flip">翻面</button></div>`;
  $('#flip').onclick = () => {
    $('#back').style.display = 'block'; say(c.hanzi);
    $('#fcBtns').innerHTML = `${playBtn(c.hanzi)}<button class="btn" data-r="0">😵 不會</button><button class="btn" data-r="1">🤔 有點印象</button><button class="btn primary" data-r="2">😎 會了</button>`;
    $('#fcBtns').onclick = e => {
      const b = e.target.closest('[data-r]'); if (!b) return;
      const r = +b.dataset.r, cur = lv[c.hanzi]||0;
      lv[c.hanzi] = r === 0 ? 0 : r === 1 ? Math.max(0, cur) : Math.min(5, cur+1);
      store.set('fcLevels', lv); nextCard();
    };
  };
}

$('#rate').value = store.get('rate', '0.85');
$('#rate').onchange = e => store.set('rate', e.target.value);
render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
